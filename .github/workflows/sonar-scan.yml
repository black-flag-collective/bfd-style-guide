name: SonarQube Scan

# Self-contained scan. This repo is public, so it cannot call the private
# black-flag-collective/action-workflows reusable workflow. It uses the public
# SonarQube scan action with the org SONAR_TOKEN secret instead.
#
# GitHub-hosted runner on purpose: hosted minutes are free for public repos,
# and the BFD self-hosted runner groups serve private repos only.
# Pull requests get the "SonarQube Code Analysis" check from SonarQube; main
# gets a branch analysis. Fork pull requests never receive the token.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonar-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sonarqube:
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Mitigate Java4Shell in scanner JVMs
        run: |
          # Protect both the bundled launcher and the scanner engine, preserving existing options.
          printf '%s\n' "JAVA_TOOL_OPTIONS=${JAVA_TOOL_OPTIONS:+$JAVA_TOOL_OPTIONS }-XX:-UseBASE64Intrinsics" >> "$GITHUB_ENV"
          printf '%s\n' "SONAR_SCANNER_JAVA_OPTS=${SONAR_SCANNER_JAVA_OPTS:+$SONAR_SCANNER_JAVA_OPTS }-XX:-UseBASE64Intrinsics" >> "$GITHUB_ENV"

      - name: Install the verified scanner trust-store JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          # Vendor SemVer selector for the verified 21.0.13.1+2 runtime.
          java-version: '21.0.13+100000002.0.LTS'

      - name: Use a clean scanner trust store
        run: |
          # Both launcher and engine must use this store, even when the CLI bundles its own JRE.
          store="$JAVA_HOME/lib/security/cacerts"
          test -s "$store"
          test -r "$store"
          trust_option="-Djavax.net.ssl.trustStore=\"$store\""
          printf '%s\n' "JAVA_TOOL_OPTIONS=${JAVA_TOOL_OPTIONS:+$JAVA_TOOL_OPTIONS }$trust_option" >> "$GITHUB_ENV"
          printf '%s\n' "SONAR_SCANNER_JAVA_OPTS=${SONAR_SCANNER_JAVA_OPTS:+$SONAR_SCANNER_JAVA_OPTS }$trust_option" >> "$GITHUB_ENV"
          printf '%s\n' 'SONAR_SCANNER_SKIP_JRE_PROVISIONING=true' >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # TypeScript analysis reads tsconfig.json, which resolves Astro's types.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarqube.blackflag.design
