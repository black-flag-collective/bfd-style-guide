<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 130" role="img" aria-label="Black Flag ensign light">
  <title>Black Flag ensign light</title>
  <!-- 13-row grid (20:13). Rows 1-7: flag block — left-half stripes on odd rows, solid canton right half. Rows 9/11/13: detached full-width stripes. -->
  <g fill="#F2F2F2">
    <rect x="0" y="0" width="100" height="10"/>
    <rect x="0" y="20" width="100" height="10"/>
    <rect x="0" y="40" width="100" height="10"/>
    <rect x="0" y="60" width="100" height="10"/>
    <rect x="100" y="0" width="100" height="70"/>
    <rect x="0" y="80" width="200" height="10"/>
    <rect x="0" y="100" width="200" height="10"/>
    <rect x="0" y="120" width="200" height="10"/>
  </g>
</svg>
