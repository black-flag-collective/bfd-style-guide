# SonarQube scanner configuration for bfd-style-guide.
#
# Authentication is supplied by CI through SONAR_TOKEN. Do not add
# sonar.token, sonar.login, or sonar.password to this file.

sonar.projectKey=bfd-style-guide
sonar.projectName=bfd-style-guide
sonar.sourceEncoding=UTF-8

sonar.sources=src,scripts
sonar.exclusions=\
  node_modules/**,\
  dist/**,\
  .astro/**,\
  **/package-lock.json,\
  **/*.svg

sonar.typescript.tsconfigPaths=tsconfig.json

sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
